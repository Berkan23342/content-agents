# Bubbly Kids TV: renders and uploads the daily videos, no Mac needed.
# YouTube publishes them at 10:00 (learning), 13:00 (Short), 18:00 (fun) and 21:00 (Short) Istanbul time.
name: Kids video

on:
  # The story writer routine pushes a new story at 08:00 and 16:00 Istanbul time: that starts the run on time.
  push:
    branches: [main]
    paths:
      - "kids-channel/stories/new/**"
  # Backups, because GitHub's scheduler can be hours late. A run with nothing due stops after a few seconds.
  schedule:
    - cron: "30 5 * * *"
    - cron: "30 7 * * *"
    - cron: "15 13 * * *"
    - cron: "15 15 * * *"
  workflow_dispatch:
    inputs:
      kind:
        type: choice
        options: [auto, learn, fun, short1, short2]
        default: auto
      upload:
        description: Upload to YouTube (off = render only, the video is kept as an artifact)
        type: boolean
        default: false
      date:
        description: YYYY-MM-DD (empty = today in Istanbul)
        type: string
        default: ""

concurrency:
  group: kids-video
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: kids-channel
    env:
      KIND: ${{ github.event_name == 'workflow_dispatch' && inputs.kind || 'auto' }}
      UPLOAD: ${{ github.event_name != 'workflow_dispatch' || inputs.upload }}
    steps:
      # latest main, not the commit that triggered the run: an earlier queued run may have uploaded meanwhile
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: What is due
        id: due
        run: |
          if [ "$KIND" = auto ]; then todo=$(python3 scripts/ci_video.py due); else todo=$KIND; fi
          echo "todo=$todo" >> "$GITHUB_OUTPUT"
          echo "due: ${todo:-nothing}"

      - uses: actions/setup-node@v4
        if: steps.due.outputs.todo != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kids-channel/package-lock.json

      - uses: actions/setup-python@v5
        if: steps.due.outputs.todo != ''
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kids-channel/requirements.txt

      - name: System packages
        if: steps.due.outputs.todo != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fluidsynth ffmpeg
          # Chrome (Remotion) libraries; most are already on the runner
          sudo apt-get install -y -qq libnss3 libgbm1 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libpango-1.0-0 libcairo2 || true

      - name: Restore models and soundfont
        if: steps.due.outputs.todo != ''
        uses: actions/cache@v4
        with:
          path: |
            kids-channel/assets/kokoro
            kids-channel/assets/soundfont/GeneralUser-GS.sf2
          key: assets-v2

      - name: Download models and soundfont (first run only)
        if: steps.due.outputs.todo != ''
        run: |
          mkdir -p assets/kokoro assets/soundfont
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          # full-precision voice model (cleaner narration than the int8 one)
          [ -f assets/kokoro/kokoro-v1.0.onnx ] || curl -sSfL -o assets/kokoro/kokoro-v1.0.onnx $base/kokoro-v1.0.onnx
          [ -f assets/kokoro/voices-v1.0.bin ] || curl -sSfL -o assets/kokoro/voices-v1.0.bin $base/voices-v1.0.bin
          [ -f assets/soundfont/GeneralUser-GS.sf2 ] || curl -sSfL -o assets/soundfont/GeneralUser-GS.sf2 https://raw.githubusercontent.com/mrbumpy409/GeneralUser-GS/main/GeneralUser-GS.sf2

      - name: Restore voice cache
        if: steps.due.outputs.todo != ''
        uses: actions/cache@v4
        with:
          path: kids-channel/build/tts-cache
          key: tts2-${{ github.run_id }}
          restore-keys: tts2-

      - if: steps.due.outputs.todo != ''
        run: npm ci
      - if: steps.due.outputs.todo != ''
        run: pip install -q -r requirements.txt

      - name: YouTube credentials
        if: steps.due.outputs.todo != ''
        env:
          CLIENT: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
        run: |
          mkdir -p secrets
          printf '%s' "$CLIENT" > secrets/client_secret.json
          printf '%s' "$TOKEN" > secrets/token.json

      - name: Make the video
        if: steps.due.outputs.todo != ''
        run: python scripts/ci_video.py "$KIND" ${{ inputs.date && format('--date {0}', inputs.date) || '' }} ${{ env.UPLOAD != 'true' && '--no-upload' || '' }}

      - name: Keep the video for 7 days
        if: always() && steps.due.outputs.todo != ''
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ env.KIND }}-${{ github.run_id }}
          path: |
            kids-channel/out/episodes/*.mp4
            kids-channel/out/episodes/*.jpg
          retention-days: 7
          if-no-files-found: ignore

      - name: Save state (uploaded list, used stories)
        if: always() && steps.due.outputs.todo != ''
        run: |
          rm -f secrets/*.json
          git config user.name "content-bot"
          git config user.email "content-bot@users.noreply.github.com"
          git add logs/uploaded.txt stories
          git diff --cached --quiet && exit 0
          git commit -q -m "kids: ${{ steps.due.outputs.todo }} video $(TZ=Europe/Istanbul date +%F)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
