# Outbreak Diary: the full-story video of every story whose finale is out (scripts/film.py): all its days in one
# horizontal video with chapters, because Shorts views do not count towards YouTube's watch hours.
name: Outbreak film

on:
  schedule:
    - cron: "0 8 * * *"    # 11:00 Istanbul, after the morning parts
    - cron: "0 11 * * *"   # a backup: GitHub's scheduler can be hours late
  workflow_dispatch:
    inputs:
      story:
        description: A story id (harbor-view, floor-41, ...) or auto (every film that is due)
        type: string
        default: auto
      upload:
        description: Upload to YouTube (off = render only, the video is kept as an artifact)
        type: boolean
        default: false
      parts:
        description: Only the first N days (a quick test, never uploaded; empty = all)
        type: string
        default: ""

concurrency:
  group: outbreak-film
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  film:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    defaults:
      run:
        working-directory: outbreak-channel
    env:
      STORY: ${{ github.event_name == 'workflow_dispatch' && inputs.story || 'auto' }}
      UPLOAD: ${{ github.event_name != 'workflow_dispatch' || inputs.upload }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: What is due
        id: due
        env:
          HAS_TOKEN: ${{ secrets.OUTBREAK_YOUTUBE_TOKEN != '' }}
        run: |
          if [ "$STORY" = auto ]; then todo=$(python3 scripts/film.py due); else todo=$STORY; fi
          echo "todo=$todo" >> "$GITHUB_OUTPUT"
          echo "due: ${todo:-nothing}"

      - uses: actions/setup-node@v4
        if: steps.due.outputs.todo != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: outbreak-channel/package-lock.json

      - uses: actions/setup-python@v5
        if: steps.due.outputs.todo != ''
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            kids-channel/requirements.txt
            outbreak-channel/requirements-voice.txt

      - name: System packages
        if: steps.due.outputs.todo != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fluidsynth ffmpeg
          sudo apt-get install -y -qq libnss3 libgbm1 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libpango-1.0-0 libcairo2 || true

      # the voice model and soundfont are shared with the kids channel (same cache)
      - name: Restore models and soundfont
        if: steps.due.outputs.todo != ''
        uses: actions/cache@v4
        with:
          path: |
            kids-channel/assets/kokoro
            kids-channel/assets/soundfont/GeneralUser-GS.sf2
          key: assets-v2

      - name: Download models and soundfont (first run only)
        if: steps.due.outputs.todo != ''
        working-directory: kids-channel
        run: |
          mkdir -p assets/kokoro assets/soundfont
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          [ -f assets/kokoro/kokoro-v1.0.onnx ] || curl -sSfL -o assets/kokoro/kokoro-v1.0.onnx $base/kokoro-v1.0.onnx
          [ -f assets/kokoro/voices-v1.0.bin ] || curl -sSfL -o assets/kokoro/voices-v1.0.bin $base/voices-v1.0.bin
          [ -f assets/soundfont/GeneralUser-GS.sf2 ] || curl -sSfL -o assets/soundfont/GeneralUser-GS.sf2 https://raw.githubusercontent.com/mrbumpy409/GeneralUser-GS/main/GeneralUser-GS.sf2

      - name: Restore voice cache
        if: steps.due.outputs.todo != ''
        uses: actions/cache@v4
        with:
          path: kids-channel/build/tts-cache
          key: outbreak-tts-${{ github.run_id }}
          restore-keys: outbreak-tts-

      - if: steps.due.outputs.todo != ''
        run: npm ci
      - if: steps.due.outputs.todo != ''
        run: pip install -q -r ../kids-channel/requirements.txt

      # The narrators are voiced by Chatterbox, which needs PyTorch: it gets its own environment (CPU build).
      - name: Voice engine
        if: steps.due.outputs.todo != ''
        run: |
          python -m venv "$HOME/cb"
          "$HOME/cb/bin/pip" install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          "$HOME/cb/bin/pip" install -q -r requirements-voice.txt
          echo "CB_PYTHON=$HOME/cb/bin/python" >> "$GITHUB_ENV"

      - name: Restore the voice model
        if: steps.due.outputs.todo != ''
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: chatterbox-0.1.7

      - name: Restore narration cache
        if: steps.due.outputs.todo != ''
        uses: actions/cache@v4
        with:
          path: outbreak-channel/build/cb-cache
          key: outbreak-cb-film-${{ github.run_id }}
          restore-keys: outbreak-cb-

      - name: YouTube credentials
        if: steps.due.outputs.todo != ''
        env:
          CLIENT: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          TOKEN: ${{ secrets.OUTBREAK_YOUTUBE_TOKEN }}
        run: |
          mkdir -p secrets
          printf '%s' "$CLIENT" > secrets/client_secret.json
          printf '%s' "$TOKEN" > secrets/token.json

      - name: Make the films
        if: steps.due.outputs.todo != ''
        run: python scripts/film.py "$STORY" ${{ env.UPLOAD != 'true' && '--no-upload' || '' }} ${{ inputs.parts && format('--parts {0}', inputs.parts) || '' }}

      - name: Keep the videos for 7 days
        if: always() && steps.due.outputs.todo != ''
        uses: actions/upload-artifact@v4
        with:
          name: outbreak-film-${{ github.run_id }}
          path: |
            outbreak-channel/out/film-*.mp4
            outbreak-channel/out/film-*.jpg
          retention-days: 7
          if-no-files-found: ignore

      - name: Save the list of films
        if: always() && steps.due.outputs.todo != ''
        run: |
          rm -f secrets/*.json
          git config user.name "content-bot"
          git config user.email "content-bot@users.noreply.github.com"
          git add logs/films.txt 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -q -m "outbreak: full-story film $(TZ=Europe/Istanbul date +%F)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
