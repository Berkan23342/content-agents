# Brain Snack Quiz: renders and uploads a Brain Snack on Mondays (Why?), Wednesdays (Mystery) and Fridays (Real life),
# no Mac needed. It is made in the morning; YouTube publishes it at 19:00 Istanbul time.
name: Quiz video

on:
  # The snack writer routine pushes new scripts in the morning: that starts the run (on other days nothing is due).
  push:
    branches: [main]
    paths:
      - "quiz-channel/snacks/new/**"
  # Backups, because GitHub's scheduler can be hours late. A run with nothing due stops after a few seconds.
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 9 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      kind:
        type: choice
        options: [auto, snack]
        default: auto
      upload:
        description: Upload to YouTube (off = render only, the video is kept as an artifact)
        type: boolean
        default: false
      date:
        description: YYYY-MM-DD (empty = today in Istanbul)
        type: string
        default: ""

concurrency:
  group: quiz-video
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: quiz-channel
    env:
      KIND: ${{ github.event_name == 'workflow_dispatch' && inputs.kind || 'auto' }}
      UPLOAD: ${{ github.event_name != 'workflow_dispatch' || inputs.upload }}
    steps:
      # latest main, not the commit that triggered the run: an earlier queued run may have uploaded meanwhile
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: What is due
        id: due
        env:
          HAS_TOKEN: ${{ secrets.QUIZ_YOUTUBE_TOKEN != '' }}
        run: |
          if [ "$UPLOAD" = true ] && [ "$HAS_TOKEN" != true ]; then
            echo "todo=" >> "$GITHUB_OUTPUT"; echo "the channel is not connected yet (QUIZ_YOUTUBE_TOKEN)"; exit 0
          fi
          if [ "$KIND" = auto ]; then todo=$(python3 scripts/ci_quiz.py due); else todo=$KIND; fi
          echo "todo=$todo" >> "$GITHUB_OUTPUT"
          echo "due: ${todo:-nothing}"

      - uses: actions/setup-node@v4
        if: steps.due.outputs.todo != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: quiz-channel/package-lock.json

      - uses: actions/setup-python@v5
        if: steps.due.outputs.todo != ''
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            kids-channel/requirements.txt
            outbreak-channel/requirements-voice.txt

      - name: System packages
        if: steps.due.outputs.todo != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fluidsynth ffmpeg fonts-noto-color-emoji
          sudo apt-get install -y -qq libnss3 libgbm1 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libpango-1.0-0 libcairo2 || true

      # the soundfont (music) is shared with the kids channel (same cache)
      - name: Restore models and soundfont
        if: steps.due.outputs.todo != ''
        uses: actions/cache@v4
        with:
          path: |
            kids-channel/assets/kokoro
            kids-channel/assets/soundfont/GeneralUser-GS.sf2
          key: assets-v2

      - name: Download models and soundfont (first run only)
        if: steps.due.outputs.todo != ''
        working-directory: kids-channel
        run: |
          mkdir -p assets/kokoro assets/soundfont
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          [ -f assets/kokoro/kokoro-v1.0.onnx ] || curl -sSfL -o assets/kokoro/kokoro-v1.0.onnx $base/kokoro-v1.0.onnx
          [ -f assets/kokoro/voices-v1.0.bin ] || curl -sSfL -o assets/kokoro/voices-v1.0.bin $base/voices-v1.0.bin
          [ -f assets/soundfont/GeneralUser-GS.sf2 ] || curl -sSfL -o assets/soundfont/GeneralUser-GS.sf2 https://raw.githubusercontent.com/mrbumpy409/GeneralUser-GS/main/GeneralUser-GS.sf2

      - if: steps.due.outputs.todo != ''
        run: npm ci
      - if: steps.due.outputs.todo != ''
        run: pip install -q -r ../kids-channel/requirements.txt

      # The host is voiced by Chatterbox (as on Outbreak Diary), which needs PyTorch: its own environment (CPU build).
      - name: Voice engine
        if: steps.due.outputs.todo != ''
        run: |
          python -m venv "$HOME/cb"
          "$HOME/cb/bin/pip" install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          "$HOME/cb/bin/pip" install -q -r ../outbreak-channel/requirements-voice.txt
          echo "CB_PYTHON=$HOME/cb/bin/python" >> "$GITHUB_ENV"

      - name: Restore the voice model
        if: steps.due.outputs.todo != ''
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: chatterbox-0.1.7

      - name: Restore host voice cache
        if: steps.due.outputs.todo != ''
        uses: actions/cache@v4
        with:
          path: quiz-channel/build/cb-cache
          key: quiz-cb-${{ github.run_id }}
          restore-keys: quiz-cb-

      - name: YouTube credentials
        if: steps.due.outputs.todo != ''
        env:
          CLIENT: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          TOKEN: ${{ secrets.QUIZ_YOUTUBE_TOKEN }}
        run: |
          mkdir -p secrets
          printf '%s' "$CLIENT" > secrets/client_secret.json
          printf '%s' "$TOKEN" > secrets/token.json

      - name: Make the Brain Snack
        if: steps.due.outputs.todo != ''
        run: python scripts/ci_quiz.py "$KIND" ${{ inputs.date && format('--date {0}', inputs.date) || '' }} ${{ env.UPLOAD != 'true' && '--no-upload' || '' }}

      - name: Keep the videos for 7 days
        if: always() && steps.due.outputs.todo != ''
        uses: actions/upload-artifact@v4
        with:
          name: quiz-${{ env.KIND }}-${{ github.run_id }}
          path: quiz-channel/out/*.mp4
          retention-days: 7
          if-no-files-found: ignore

      - name: Save state (uploaded list, used scripts)
        if: always() && steps.due.outputs.todo != ''
        run: |
          rm -f secrets/*.json
          git config user.name "content-bot"
          git config user.email "content-bot@users.noreply.github.com"
          git add logs/uploaded.txt snacks
          git diff --cached --quiet && exit 0
          git commit -q -m "quiz: ${{ steps.due.outputs.todo }} $(TZ=Europe/Istanbul date +%F)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
