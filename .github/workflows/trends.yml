# Twice a week: what is working right now in our niches (trends/latest.md), for the writer agents to learn from.
name: Trends

on:
  schedule:
    - cron: "0 3 * * 1"  # Monday, before the writers run
    - cron: "0 3 * * 4"  # Thursday
  workflow_dispatch:

concurrency:
  group: trends
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -q google-api-python-client==2.201.0 google-auth==2.62.0 google-auth-oauthlib==1.5.0 google-auth-httplib2==0.4.4 httplib2==0.32.1

      # read-only search with the quiz channel's sign-in (the uploader refuses to open a browser on a server)
      - name: YouTube credentials
        env:
          CLIENT: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          TOKEN: ${{ secrets.QUIZ_YOUTUBE_TOKEN }}
        run: |
          mkdir -p secrets
          printf '%s' "$CLIENT" > secrets/client_secret.json
          printf '%s' "$TOKEN" > secrets/token.json

      - name: Scan
        run: python trends/scan.py --token secrets/token.json --client secrets/client_secret.json

      - name: Save the report
        if: always()
        run: |
          rm -rf secrets
          git config user.name "content-bot"
          git config user.email "content-bot@users.noreply.github.com"
          git add trends
          git diff --cached --quiet && exit 0
          git commit -q -m "trends: $(date +%F)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
